function getImages(v){

  let arr = [];

  if(v.image && String(v.image).trim()){

    arr.push(
      String(v.image).trim()
    );

  }

  if(v.images){

    String(v.images)
    .split(",")

    String(p || "")

  );

  function initHomepageMakeModelSearch() {
  const vehicleData =
    window.CARSCOUT_VEHICLE_DATA || {};

  const listingTypeSelect =
    document.getElementById("listingTypeSearch");

  const makeSelect =
    document.getElementById("makeSearch");

  const modelSelect =
    document.getElementById("modelSearch");

  makeSelect.innerHTML =
    '<option value="">All Makes</option>';

  Object.keys(vehicleData).sort().forEach(make => {
    const option = document.createElement("option");
    option.value = make;
    option.textContent = make;
    makeSelect.appendChild(option);
  });

  makeSelect.addEventListener("change", () => {
    const selectedMake = makeSelect.value;

    if (!selectedMake) {
      modelSelect.innerHTML =
        '<option value="">Select make first</option>';
      modelSelect.disabled = true;
      return;
    }

    modelSelect.innerHTML =
      '<option value="">All Models</option>';

    vehicleData[selectedMake].forEach(model => {
      const option = document.createElement("option");
      option.value = model;
      option.textContent = model;
      modelSelect.appendChild(option);
    });

    modelSelect.disabled = false;
  });

  listingTypeSelect.addEventListener("change", () => {
    const flexibleListing =
      listingTypeSelect.value ===
      "motorcycle_leisure";

    if (flexibleListing) {
      makeSelect.value = "";
      makeSelect.disabled = true;

      modelSelect.innerHTML =
        '<option value="">Use keyword search</option>';
      modelSelect.disabled = true;
      return;
    }

    makeSelect.disabled = false;

    if (!makeSelect.value) {
      modelSelect.innerHTML =
        '<option value="">Select make first</option>';
      modelSelect.disabled = true;
    }
  });
}

initHomepageMakeModelSearch();

function toggleSave(id, el){

JSON.parse(localStorage.getItem("savedCars") || "[]");

if(saved.includes(id)){

const updated =
saved.filter(x => x !== id);

localStorage.setItem(
"savedCars",
JSON.stringify(updated)
);

el.innerHTML = "♡";
el.classList.remove("saved");

} else {

saved.push(id);

localStorage.setItem(
"savedCars",
JSON.stringify(saved)
);

el.innerHTML = "♥";
el.classList.add("saved");
}
}

async function trackVehicleShare(vehicleId, dealerUserId) {
  try {
    const response = await fetch(
      supabaseUrl + "/rest/v1/vehicle_clicks",
      {
        method: "POST",
        keepalive: true,
        headers: {
          apikey: supabaseKey,
          Authorization: "Bearer " + supabaseKey,
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify({
          vehicle_id: vehicleId,
          dealer_user_id: dealerUserId || null,
          click_type: "share"
        })
      }
    );

    if (!response.ok) {
      console.log(
        "Share tracking failed:",
        response.status,
        await response.text()
      );
    }
  } catch (err) {
    console.log("Share tracking error:", err);
  }
}

}
