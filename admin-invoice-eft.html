<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Invoice / EFT Requests | CarScoutZA Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef2f7;color:#15233c;margin:0}header{background:linear-gradient(110deg,#172554,#3156c7);color:white;padding:30px 16px;text-align:center}header h1{margin:0 0 8px}main{max-width:1100px;margin:20px auto;padding:0 16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.btn{display:inline-block;border:0;border-radius:8px;padding:12px 15px;background:#3156c7;color:white;font-weight:bold;cursor:pointer;text-decoration:none}.btn-green{background:#16834a}.btn-dark{background:#172033}.dealer-list{display:grid;gap:14px}.dealer-row{background:white;border-radius:12px;padding:20px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;box-shadow:0 2px 12px #0001}.dealer-name{font-size:22px;font-weight:800;margin-bottom:8px}.dealer-meta{margin:5px 0;color:#475569;overflow-wrap:anywhere}.dealer-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#status{padding:16px;border-radius:9px;background:#fff;font-weight:bold}</style></head><body><header><h1>Invoice / EFT Payment Requests</h1><p>CarScoutZA Owner Administration</p></header><main><div class="toolbar"><a class="btn btn-dark" href="super-admin.html">Back to Super Admin</a><button class="btn" id="refresh" type="button" hidden>Refresh Requests</button></div><p id="status">Checking owner administrator access…</p><p>Only activate a dealer after confirming that the R2,000 payment reflects in the CarScoutZA bank account. Once-off invoice payments activate 30 days.</p><div id="invoiceRequestList" class="dealer-list"></div></main><script>
const client=window.supabase.createClient("https://ddmvzypiccryjndcwlre.supabase.co","sb_publishable_D7saHOTE_JhSlMnSgBnIhQ_mOAOUD9s");
const OWNER_ADMIN_EMAIL="autoexcellence@telkomsa.net";
let currentAdminRole="NONE";
function isOwnerAdmin(){return currentAdminRole==="OWNER"}
function requireOwnerAdmin(){if(isOwnerAdmin())return true;alert("This action is restricted to the CarScoutZA owner administrator.");return false}
function safeText(value) {
  return String(value ?? "").replace(/[&<>'"]/g, function(character) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[character];
  });
}

async function viewInvoiceProof(path) {
  if (!requireOwnerAdmin()) return;
  const { data, error } = await client.storage
    .from("invoice-payment-proofs")
    .createSignedUrl(path, 120);
  if (error || !data?.signedUrl) {
    alert("The payment proof could not be opened.");
    return;
  }
  window.open(data.signedUrl, "_blank", "noopener");
}

async function activateInvoicePayment(requestId, dealerName) {
  if (!requireOwnerAdmin()) return;
  const confirmed = confirm(
    "Confirm EFT payment for " + dealerName + "?\n\n" +
    "Only continue if the R2,000 payment reflects in the CarScoutZA bank account. " +
    "This will activate 30 days of paid access and restore the dealer's public stock."
  );
  if (!confirmed) return;

  const { data, error } = await client.rpc("admin_activate_invoice_payment", {
    p_request_id: requestId
  });
  if (error) {
    console.error(error);
    alert("Activation failed: " + error.message);
    return;
  }
  alert(
    "Payment confirmed and dealer activated.\n\nReceipt: " +
    (data?.receipt_number || "Created")
  );
  loadInvoiceRequests();
}

async function loadInvoiceRequests() {
  if (!requireOwnerAdmin()) return;
  const list = document.getElementById("invoiceRequestList");
  const { data: requests, error } = await client
    .from("invoice_renewal_requests")
    .select("*")
    .order("created_at", { ascending: false });
  if (error) {
    console.error(error);
    list.innerHTML = '<div class="dealer-row">Invoice requests are not available until the database migration is deployed.</div>';
    return;
  }
  if (!requests?.length) {
    list.innerHTML = '<div class="dealer-row">No invoice or EFT requests yet.</div>';
    return;
  }
  const dealerIds = [...new Set(requests.map(request => request.dealer_id))];
  const { data: profiles } = await client.from("profiles").select("id,dealer_name,phone").in("id", dealerIds);
  const profileMap = Object.fromEntries((profiles || []).map(profile => [profile.id, profile]));
  list.innerHTML = "";
  requests.forEach(function(request) {
    const dealer = profileMap[request.dealer_id] || {};
    const dealerName = dealer.dealer_name || request.registered_name || "Dealer";
    const row = document.createElement("div");
    row.className = "dealer-row";
    row.innerHTML = `<div class="dealer-info">
      <div class="dealer-name">${safeText(dealerName)}</div>
      <div class="dealer-meta"><strong>${safeText(request.invoice_number)}</strong> — R2,000.00</div>
      <div class="dealer-meta">Status: <strong>${safeText(request.status.replaceAll("_"," "))}</strong></div>
      <div class="dealer-meta">Registered name: ${safeText(request.registered_name)}</div>
      <div class="dealer-meta">Registration: ${safeText(request.company_registration_number || "-")} | VAT: ${safeText(request.vat_number || "-")}</div>
      <div class="dealer-meta">Accounts: ${safeText(request.accounts_email)} | Contact: ${safeText(request.contact_person)}</div>
      <div class="dealer-meta">Billing address: ${safeText(request.billing_address)}</div>
      <div class="dealer-meta">PO number: ${safeText(request.purchase_order_number || "-")}</div>
      <div class="dealer-meta">Requested: ${safeText(new Date(request.created_at).toLocaleString("en-ZA"))}</div>
      ${request.proof_submitted_at ? `<div class="dealer-meta">Proof submitted: ${safeText(new Date(request.proof_submitted_at).toLocaleString("en-ZA"))}</div>` : ""}
      ${request.period_end ? `<div class="dealer-meta">Activated until: ${safeText(new Date(request.period_end).toLocaleString("en-ZA"))}</div>` : ""}
    </div><div class="dealer-actions">
      ${request.proof_storage_path ? `<button class="btn btn-dark" type="button" data-proof>View Payment Proof</button>` : ""}
      ${request.status === "PAYMENT_SUBMITTED" ? `<button class="btn btn-green" type="button" data-activate>Confirm Payment & Activate 30 Days</button>` : ""}
    </div>`;
    const proofButton = row.querySelector("[data-proof]");
    if (proofButton) proofButton.onclick = () => viewInvoiceProof(request.proof_storage_path);
    const activateButton = row.querySelector("[data-activate]");
    if (activateButton) activateButton.onclick = () => activateInvoicePayment(request.id, dealerName);
    list.appendChild(row);
  });
}


(async()=>{const {data,error}=await client.auth.getUser();if(error||!data?.user){document.getElementById("status").textContent="Please sign in as the owner administrator.";return}if((data.user.email||"").toLowerCase().trim()!==OWNER_ADMIN_EMAIL){document.getElementById("status").textContent="Access denied. This page is restricted to the owner administrator.";return}currentAdminRole="OWNER";document.getElementById("status").textContent="Owner admin access granted.";document.getElementById("refresh").hidden=false;await loadInvoiceRequests()})();
document.getElementById("refresh").addEventListener("click",()=>loadInvoiceRequests());
</script></body></html>
