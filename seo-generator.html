<script>

const SUPABASE_URL_PAGE = "${SUPABASE_URL}";
const SUPABASE_KEY_PAGE = "${SUPABASE_KEY}";

const PAGE_VEHICLE = ${JSON.stringify(vehicle)};
const PAGE_CITY = ${JSON.stringify(city)};
function escapeHtml(value){
return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}
function formatMileage(value){

const number = Number(
String(value || "").replace(/[^0-9]/g,"")
);

if(!number){
return "";
}


return number.toLocaleString("en-ZA") + " km";
}
function money(value){

const number = Number(
String(value || "").replace(/[^0-9.]/g,"")
);

if(!number){
return "";
}


return "R" + number.toLocaleString("en-ZA");

}

function firstImage(vehicle){

if(vehicle.image_url){
return vehicle.image_url;
}

if(vehicle.image){
return vehicle.image;
}

if(Array.isArray(vehicle.images) && vehicle.images.length){
return vehicle.images[0];
}

if(Array.isArray(vehicle.photos) && vehicle.photos.length){
return vehicle.photos[0];
}

return "";

}

async function loadVehicleStock(){

const container = document.getElementById("vehicleStock");

try{

if(
!SUPABASE_KEY_PAGE ||
SUPABASE_KEY_PAGE === "YOUR_EXISTING_SUPABASE_ANON_KEY"
){

container.innerHTML =
'<div class="empty-stock">Browse current CarScoutZA stock using the search button above.</div>';

return;

}

const endpoint =
SUPABASE_URL_PAGE +
"/rest/v1/vehicles?select=*&limit=1000";

const response = await fetch(endpoint,{
headers:{
  apikey: SUPABASE_KEY_PAGE
}
});

if(!response.ok){
throw new Error("Unable to load stock");
}

const rows = await response.json();

const wantedVehicle = PAGE_VEHICLE.toLowerCase();
const wantedCity = PAGE_CITY.toLowerCase();

const matches = rows.filter(function(item){

const make = String(item.make || "").toLowerCase();
const model = String(item.model || "").toLowerCase();
const combined = (make + " " + model).trim();

const cityValue = String(
item.city ||
item.dealer_city ||
item.location ||
""
).toLowerCase();

const vehicleMatch =
combined.includes(wantedVehicle) ||
wantedVehicle.includes(combined);

const cityMatch =
!cityValue ||
cityValue.includes(wantedCity) ||
wantedCity.includes(cityValue);

return vehicleMatch && cityMatch;

});

if(!matches.length){

container.innerHTML =
'<div class="empty-stock">No matching ${escapeHtml(vehicle)} vehicles are currently listed in ${escapeHtml(city)}. Search all CarScoutZA vehicles to see stock available elsewhere in South Africa.</div>';

return;

}

container.innerHTML = matches.slice(0,12).map(function(item){

const title = [
item.year || "",
item.make || "",
item.model || "",
item.variant || ""
].join(" ").replace(/\\s+/g," ").trim();

const image = firstImage(item);

const detailsUrl =
item.id
? "https://carscoutza.com/details.html?id=" + encodeURIComponent(item.id)
: "https://carscoutza.com/";

return \`
<article class="stock-card">

\${image ? \`
<img
src="\${escapeHtml(image)}"
alt="\${escapeHtml(title)} for sale"
loading="lazy">
\` : ""}

<div class="stock-card-content">

<h3>\${escapeHtml(title || PAGE_VEHICLE)}</h3>

\${item.price ? \`
<div class="price">\${money(item.price)}</div>
\` : ""}

\${item.mileage ? \`
<p>\${formatMileage(item.mileage)}</p>
\` : ""}

<a class="button"
href="\${escapeHtml(detailsUrl)}">
View Vehicle
</a>

</div>

</article>
\`;

}).join("");

}catch(error){

console.error(error);

container.innerHTML =
'<div class="empty-stock">Current stock could not be loaded. Please browse all vehicles on CarScoutZA.</div>';

}

}

loadVehicleStock();

<\/script>

</body>
</html>`;
}

function cityVehicleImage(v) {
  if (v.image && String(v.image).trim()) {
    return String(v.image).trim();
  }

  if (Array.isArray(v.images) && v.images.length) {
    return v.images[0];
  }

  if (typeof v.images === "string" && v.images.trim()) {
    try {
      const parsed = JSON.parse(v.images);
      if (Array.isArray(parsed) && parsed.length) {
        return parsed[0];
      }
    } catch (e) {
      return v.images.split(",")[0].trim();
    }
  }

  return "https://via.placeholder.com/400x300?text=No+Image";

function cityPrice(price) {

}

function downloadFile(filename, content){

const blob = new Blob(
[content],
{type:"text/html;charset=utf-8"}
);

const url = URL.createObjectURL(blob);

const link = document.createElement("a");

link.href = url;
link.download = filename;

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

setTimeout(function(){
URL.revokeObjectURL(url);
},1000);

}
