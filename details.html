<script>

function setStatus(message){

function getId(){

function formatPrice(price){

  const num =
    Number(
      String(price || "")
      .replace(/\D/g, "")
    );

  if (!num) return "R0";

  return "R" +
    num.toLocaleString("en-ZA");
}
function calculateInstallment() {
  const priceInput = document.getElementById("financePrice");
  const depositInput = document.getElementById("financeDeposit");
  const interestInput = document.getElementById("financeInterest");
  const termInput = document.getElementById("financeTerm");
  const result = document.getElementById("instalmentResult");

  if (
    !priceInput ||
    !depositInput ||
    !interestInput ||
    !termInput ||
    !result
  ) {
    return;
  }

  const price =
  Number(String(priceInput.value).replace(/[^\d.]/g, "")) || 0;
  const deposit = Number(depositInput.value) || 0;
  const annualInterest = Number(interestInput.value) || 0;
  const months = Number(termInput.value) || 72;
  const financeAmount = Math.max(price - deposit, 0);

  if (financeAmount <= 0) {
    result.textContent = "Please enter a valid finance amount.";
    return;
  }

  const monthlyInterest = annualInterest / 100 / 12;

  const monthlyInstalment =
    monthlyInterest === 0
      ? financeAmount / months
      : financeAmount *
        monthlyInterest *
        Math.pow(1 + monthlyInterest, months) /
        (Math.pow(1 + monthlyInterest, months) - 1);

  result.textContent =
    "Estimated Instalment: ± R" +
    Math.round(monthlyInstalment).toLocaleString("en-ZA") +
    " per month";
}
function cleanPhone(phone){

  return String(phone || "")

}

function callLink(phone){

function whatsappLink(phone, title){

  let phoneClean =
    cleanPhone(phone);

  if (!phoneClean) return "#";

  if (phoneClean.startsWith("0")) {

    phoneClean =
      "27" + phoneClean.substring(1);
  }

  return "https://wa.me/" +
    phoneClean +
    "?text=" +
    encodeURIComponent(
      "Hi, I saw the " +
      (title || "vehicle") +
      " on CarScoutZA and I'm interested."

}

function getImages(vehicle){

  const arr = [];

  if (
    vehicle.image &&
    String(vehicle.image).trim()
  ){
    arr.push(
      String(vehicle.image).trim()
    );
  }

  if (
    vehicle.images &&
    String(vehicle.images).trim()
  ){

    String(vehicle.images)
      .split(",")
      .map(x => x.trim())
      .filter(Boolean)
      .forEach(url => {

        if (!arr.includes(url)) {
          arr.push(url);
        }
      });
  }

  if (!arr.length) {

    arr.push(
      "https://via.placeholder.com/900x600?text=No+Image"
    );
  }

  return arr;
}

function updateSEO(vehicle, title, imageUrl){

  const seoLocation =
    vehicle.location ||

  const seoTitle =

      : ""
    ) +

  document.title = seoTitle;

  document
    .getElementById("metaDesc")
    .setAttribute("content", seoDesc);

  document

  document
    .getElementById("ogDesc")
    .setAttribute("content", seoDesc);

  document
    .getElementById("ogImage")

}
function updateVehicleSchema(vehicle, title, imageUrl) {
  const oldSchema = document.getElementById("vehicleSchema");

  if (oldSchema) {
    oldSchema.remove();
  }

  const numericPrice = Number(
    String(vehicle.price || "").replace(/[^\d.]/g, "")
  );

  const numericMileage = Number(
    String(vehicle.mileage || "").replace(/[^\d.]/g, "")
  );

  const schema = {
    "@context": "https://schema.org",
    "@type": "Vehicle",
    "name": title,
    "url": window.location.href,
    "image": imageUrl || undefined,
    "vehicleModelDate": vehicle.year
      ? String(vehicle.year)
      : undefined,
    "brand": vehicle.make
      ? {
          "@type": "Brand",
          "name": vehicle.make
        }
      : undefined,
    "model": vehicle.model || undefined,
    "mileageFromOdometer": numericMileage
      ? {
          "@type": "QuantitativeValue",
          "value": numericMileage,
          "unitCode": "KMT"
        }
      : undefined,
    "offers": numericPrice
      ? {
          "@type": "Offer",
          "priceCurrency": "ZAR",
          "price": numericPrice,
          "availability": "https://schema.org/InStock",
          "url": window.location.href
        }
      : undefined
  };

  const cleanSchema = JSON.parse(
    JSON.stringify(schema)
  );

  const script = document.createElement("script");

  script.id = "vehicleSchema";
  script.type = "application/ld+json";
  script.textContent = JSON.stringify(cleanSchema);

  document.head.appendChild(script);
}
async function trackSiteVisit(vehicle){

  try {

    await fetch(
      supabaseUrl + "/rest/v1/site_visits",
      {
        method:"POST",

        headers:{
          apikey:supabaseKey,
          Authorization:"Bearer " + supabaseKey,
          "Content-Type":"application/json",
          Prefer:"return=minimal"
        },

        body: JSON.stringify({
          page:"details",
          dealer:
            vehicle.dealer ||
            vehicle.dealer_name ||
            null,
          vehicle_id:
            vehicle.id || null
        })
      }
    );

  } catch(err){
    console.log(err);
  }
}

async function trackVehicleClick(type, vehicle){

  if (!vehicle || !vehicle.id) return;

  try {

    await fetch(
      supabaseUrl + "/rest/v1/vehicle_clicks",
      {
        method:"POST",
keepalive: true,
        headers:{
          apikey:supabaseKey,
          Authorization:"Bearer " + supabaseKey,
          "Content-Type":"application/json",
          Prefer:"return=minimal"
        },

        body: JSON.stringify({
          vehicle_id: vehicle.id,
          dealer_user_id:
            vehicle.user_id || null,
          click_type: type
        })
      }
    );

  } catch(err){
    console.log(err);
  }
}

    .src = images[current];

  document
    .getElementById("modalCount")
    .textContent =
      (current + 1) +
      " / " +
      images.length;
}

function nextImage(){

  if (!images.length) return;

  current =
    (current + 1) %
    images.length;

  updateModal();
  setMain(current);
}

function prevImage(){

  if (!images.length) return;

  current =
    (current - 1 + images.length) %
    images.length;

  updateModal();
  setMain(current);
}

function openEnquire(){

  document
    .getElementById("enquireModal")
    .classList.add("show");
}

function closeEnquire(){

  document
    .getElementById("enquireModal")
    .classList.remove("show");
}

function sendEnquiry(){

  if (!currentVehicle){

    alert("Vehicle not ready yet.");
    return;
  }

  const name =
    document.getElementById("enqName")
    .value.trim();

  const phone =
    document.getElementById("enqPhone")
    .value.trim();

  const msg =
    document.getElementById("enqMsg")
    .value.trim();

  if (!name || !phone || !msg){

    alert(
      "Please complete all fields."
    );

    return;
  }

  const dealerPhone =
    cleanPhone(
      currentVehicle.phone ||
      currentVehicle.dealer_phone
    );

  trackVehicleClick(
    "whatsapp",
    currentVehicle
  );

  const fullMsg =
`Vehicle enquiry from CarScoutZA:

Vehicle: ${currentTitle}
Price: ${formatPrice(currentVehicle.price)}

Name: ${name}
Phone: ${phone}

${msg}`;

  const url =
    "https://wa.me/27" +
    dealerPhone.replace(/^0/, "") +
    "?text=" +
    encodeURIComponent(fullMsg);

  window.open(url, "_blank");

  closeEnquire();
}
