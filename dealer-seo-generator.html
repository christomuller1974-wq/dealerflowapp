<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarScoutZA Dealer SEO Generator</title>
</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const supabaseUrl = "https://ddmvzypiccryjndcwlre.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkbXZ6eXBpY2NyeWpuZGN3bHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NTQ2NzYsImV4cCI6MjA5MTQzMDY3Nn0.mNkODdvX8gllTZeqfr7nllMWfF7ATdj9MY-EKEE3G6w";

  const client = supabase.createClient(supabaseUrl, supabaseKey);
  async function loadVerifiedDealers() {
  document.getElementById("status").textContent = "Loading verified dealers...";

  const { data, error } = await client
    .from("profiles")
  .select("id, dealer_name, town, province, location")
    .eq("dealer_verified", true);

  if (error) {
    console.error(error);
    document.getElementById("status").textContent =
      "Could not load verified dealers.";
    return;
  }

  document.getElementById("status").textContent =
    `Loaded ${data.length} verified dealers.`;

  const list = document.getElementById("dealerList");
  list.innerHTML = "";

const grouped = {};

data.forEach(function(dealer) {

  let city = dealer.town;

  if (!city && dealer.location) {
    const parts = dealer.location.split(",");
    city = parts[parts.length - 1].trim();
  }

  city = city || "Unknown City";

  const province = dealer.province || "Unknown Province";

  if (!grouped[province]) {
    grouped[province] = {};
  }

  if (!grouped[province][city]) {
    grouped[province][city] = [];
  }

  grouped[province][city].push(dealer);
});

Object.keys(grouped).sort().forEach(function(province) {

  const provinceHeading = document.createElement("h2");
  provinceHeading.textContent = province;
  list.appendChild(provinceHeading);

  Object.keys(grouped[province]).sort().forEach(function(city) {

    const cityHeading = document.createElement("h3");
    cityHeading.textContent = city;
    list.appendChild(cityHeading);

    grouped[province][city].forEach(function(dealer) {

      const item = document.createElement("p");
      item.textContent = dealer.dealer_name;

      list.appendChild(item);
    });

  });

});
    
}
</script>
<body>

  <h1>CarScoutZA Dealer SEO Generator</h1>

  <p id="status">Ready to load verified dealers...</p>
<button onclick="loadVerifiedDealers()">Load Verified Dealers</button>

<div id="dealerList"></div>
</body>
</html>
