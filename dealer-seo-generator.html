function slugify(value){return String(value||"").toLowerCase().trim().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function escapeHtml(value){return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

function dealerProvince(dealer){if(dealer.province)return String(dealer.province).trim();const parts=String(dealer.location||"").split(",").map(function(part){return part.trim();}).filter(Boolean);return parts.length>1?parts[parts.length-1]:"South Africa";}
function dealerFileName(dealer){if(existingDealerUrls[String(dealer.id)])return existingDealerUrls[String(dealer.id)];const city=dealerCity(dealer);const dealerSlug=slugify(dealer.dealer_name);const citySlug=slugify(city);return(dealerSlug.includes(citySlug)?dealerSlug:dealerSlug+"-"+citySlug)+".html";}
function firstImage(vehicle){if(vehicle.image&&String(vehicle.image).trim())return String(vehicle.image).trim();if(Array.isArray(vehicle.images)&&vehicle.images.length)return vehicle.images[0];if(typeof vehicle.images==="string"&&vehicle.images.trim()){try{const parsed=JSON.parse(vehicle.images);if(Array.isArray(parsed)&&parsed.length)return parsed[0];}catch(error){return vehicle.images.split(",")[0].trim();}}return"";}
function money(value){const number=Number(String(value||"").replace(/[^0-9.]/g,""));return number?"R"+number.toLocaleString("en-ZA"):"Price on request";}
function mileage(value){const number=Number(String(value||"").replace(/[^0-9]/g,""));return number?number.toLocaleString("en-ZA")+" km":"Mileage not listed";}
function phoneLink(value){return String(value||"").replace(/[^0-9+]/g,"");}
function whatsappLink(value){let digits=String(value||"").replace(/\D/g,"");if(digits.startsWith("0"))digits="27"+digits.slice(1);return digits;}
function vehicleTitle(vehicle){return[vehicle.year,vehicle.make,vehicle.model,vehicle.variant].filter(Boolean).join(" ").replace(/\s+/g," ").trim()||vehicle.title||"Used vehicle";}
function stockForDealer(dealer){return verifiedVehicles.filter(function(vehicle){return String(vehicle.user_id||"")===String(dealer.id||"");});}

function buildDealerPage(dealer,stock){
const city=dealerCity(dealer),province=dealerProvince(dealer),name=publicDealerName(dealer.dealer_name,city),fileName=dealer._fileName||dealerFileName(dealer);
const pageUrl="https://carscoutza.com/"+fileName;
const pageTitleName=slugify(name).includes(slugify(city))?name:name+" "+city;
const liveStockUrl="https://carscoutza.com/dealer.html?dealer="+encodeURIComponent(dealer.id);
const phone=dealer.phone||(stock[0]&&stock[0].phone)||"";
const whatsapp=dealer.whatsapp_phone||(stock[0]&&stock[0].whatsapp_phone)||phone;
const logo=dealer.logo_url||"";
const shownStock=stock.slice(0,18);
const itemList=shownStock.map(function(vehicle,index){return{"@type":"ListItem","position":index+1,"url":"https://carscoutza.com/details.html?id="+encodeURIComponent(vehicle.id),"name":vehicleTitle(vehicle)};});
const graph=[{"@type":"AutoDealer","@id":pageUrl+"#dealer","name":name,"url":pageUrl,"image":logo||undefined,"telephone":phone||undefined,"address":{"@type":"PostalAddress","addressLocality":city,"addressRegion":province,"addressCountry":"ZA"}},{"@type":"CollectionPage","@id":pageUrl+"#page","name":name+" used cars for sale in "+city,"url":pageUrl,"description":"Browse current used vehicles for sale from "+name+" in "+city+", "+province+".","mainEntity":{"@id":pageUrl+"#dealer"},"isPartOf":{"@type":"WebSite","name":"CarScoutZA","url":"https://carscoutza.com/"}}];
if(itemList.length)graph.push({"@type":"ItemList","name":"Current vehicles from "+name,"numberOfItems":itemList.length,"itemListElement":itemList});
const stockCards=shownStock.map(function(vehicle){const title=vehicleTitle(vehicle),image=firstImage(vehicle),detailsUrl="https://carscoutza.com/details.html?id="+encodeURIComponent(vehicle.id);return`<article class="vehicle-card">${image?`<img src="${escapeHtml(image)}" alt="${escapeHtml(title)} for sale at ${escapeHtml(name)}" loading="lazy">`:""}<div class="vehicle-card-body"><h3>${escapeHtml(title)}</h3><div class="vehicle-price">${escapeHtml(money(vehicle.price))}</div><div class="vehicle-meta">${escapeHtml(mileage(vehicle.mileage))}</div><div class="vehicle-meta">${escapeHtml(city)}, ${escapeHtml(province)}</div><a class="vehicle-link" href="${escapeHtml(detailsUrl)}">View Vehicle Details</a></div></article>`;}).join("");
const uniqueMakes=[];
stock.forEach(function(vehicle){const make=String(vehicle.make||"").trim();if(make&&supportedBrandSlugs.includes(slugify(make))&&!uniqueMakes.includes(make))uniqueMakes.push(make);});
const makeLinks=supportedCitySlugs.includes(slugify(city))?uniqueMakes.slice(0,10).map(function(make){return`<a href="https://carscoutza.com/${slugify(make)}-for-sale-${slugify(city)}.html">${escapeHtml(make)} for Sale in ${escapeHtml(city)}</a>`;}).join(""):"";
const cityPageLink=supportedCitySlugs.includes(slugify(city))?`<a href="https://carscoutza.com/used-cars-for-sale-${slugify(city)}.html">Used Cars for Sale in ${escapeHtml(city)}</a>`:"";
const description=`Browse ${stock.length?stock.length+" current ":"current "}used vehicles for sale from ${name} in ${city}, ${province}. View prices, mileage and contact the verified dealer directly on CarScoutZA.`;
return`<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(pageTitleName)} | Used Cars for Sale | CarScoutZA</title>
<meta name="description" content="${escapeHtml(description)}"><meta name="robots" content="index, follow, max-image-preview:large"><link rel="canonical" href="${pageUrl}">
<meta property="og:title" content="${escapeHtml(pageTitleName)} | Used Cars for Sale"><meta property="og:description" content="${escapeHtml(description)}"><meta property="og:url" content="${pageUrl}"><meta property="og:type" content="website">${logo?`<meta property="og:image" content="${escapeHtml(logo)}">`:""}<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">${JSON.stringify({"@context":"https://schema.org","@graph":graph})}<\/script>

s:9px}footer{padding:20px 0;color:#667085;font-size:14px}@media(max-width:650px){h1{font-size:29px}.hero-grid{grid-template-columns:1fr}.hero,.section{padding:21px}.dealer-logo{width:110px}.stock-grid{grid-template-columns:1fr}}
</style></head><body><main class="container">
<nav class="breadcrumbs"><a href="https://carscoutza.com/">CarScoutZA</a> › <a href="https://carscoutza.com/dealers.html">Verified Dealers</a> › ${escapeHtml(name)}</nav>
<section class="hero"><div class="hero-grid"><div><span class="verified">✓ CarScoutZA Verified Dealer</span><h1>${escapeHtml(name)} – Used Cars for Sale in ${escapeHtml(city)}</h1><p class="intro">Browse current vehicles from <strong>${escapeHtml(name)}</strong> in ${escapeHtml(city)}, ${escapeHtml(province)}. Compare prices and mileage, then contact the dealership directly.</p><div class="actions"><a class="button" href="${escapeHtml(liveStockUrl)}">View Current ${escapeHtml(name)} Stock</a>${whatsapp?`<a class="button secondary" href="https://wa.me/${whatsappLink(whatsapp)}">WhatsApp Dealer</a>`:""}${phone?`<a class="button secondary" href="tel:${phoneLink(phone)}">Call Dealer</a>`:""}</div><div class="stats"><span class="stat">${stock.length} vehicle${stock.length===1?"":"s"} listed</span><span class="stat">Located in ${escapeHtml(city)}</span><span class="stat">Direct dealer contact</span></div></div>${logo?`<img class="dealer-logo" src="${escapeHtml(logo)}" alt="${escapeHtml(name)} logo">`:""}</div></section>
<section class="section"><h2>Current Vehicles from ${escapeHtml(name)}</h2><p id="dealerStockNote">This stock was available when the page was updated. The list refreshes from the dealer’s live verified inventory.</p><div id="dealerStock" class="stock-grid">${stockCards||`<div class="empty">No vehicles are currently listed from ${escapeHtml(name)}. Stock changes regularly, so please check again soon.</div>`}</div></section>
<section class="section"><h2>About ${escapeHtml(name)} in ${escapeHtml(city)}</h2><p>${escapeHtml(name)} is listed on CarScoutZA as a verified motor dealer in ${escapeHtml(city)}, ${escapeHtml(province)}. Buyers can browse dealership stock, view vehicle prices and mileage, and contact the dealer directly about availability, finance, trade-ins or a viewing.</p><p><strong>Dealer location:</strong> ${escapeHtml(dealer.location||city+", "+province)}</p></section>

<section class="section"><h2>Buying a Used Car from ${escapeHtml(name)}</h2><ol><li>Browse the available vehicles and compare price, year and mileage.</li><li>Open the vehicle advert for its specifications and dealer details.</li><li>Call or WhatsApp ${escapeHtml(name)} directly to confirm availability and arrange a viewing.</li></ol><p>Always confirm the vehicle’s service history, condition, warranty information, finance terms and trade-in value directly with the dealership.</p></section>

<footer>CarScoutZA – Where Buyers Meet Trusted Dealers.</footer></main><script>const U=${JSON.stringify(supabaseUrl)},K=${JSON.stringify(supabaseKey)},D=${JSON.stringify(String(dealer.id))};fetch(U+"/rest/v1/public_active_verified_vehicles_test?select=*&user_id=eq."+encodeURIComponent(D)+"&order=updated_at.desc&limit=18",{headers:{apikey:K,Authorization:"Bearer "+K}}).then(r=>r.ok?r.json():Promise.reject()).then(rows=>{document.getElementById("dealerStockNote").textContent=rows.length?"Showing the dealer’s current verified CarScoutZA inventory.":"No current vehicles are listed from this dealer. Stock changes regularly.";if(rows.length)document.getElementById("dealerStock").innerHTML=rows.map(v=>{const t=[v.year,v.make,v.model,v.variant].filter(Boolean).join(" "),img=v.image||String(v.images||"").split(",")[0];return `<article class="vehicle-card">${img?`<img src="${escapeHtml(img)}" alt="${escapeHtml(t)} for sale at ${escapeHtml(name)}" loading="lazy">`:""}<div class="vehicle-card-body"><h3>${escapeHtml(t)}</h3><div class="vehicle-price">${escapeHtml(money(v.price))}</div><div class="vehicle-meta">${escapeHtml(mileage(v.mileage))}</div><a class="vehicle-link" href="details.html?id=${encodeURIComponent(v.id)}">View Vehicle Details</a></div></article>`}).join("")}).catch(()=>{document.getElementById("dealerStockNote").textContent="Live stock could not be refreshed just now. Use the current-stock button above."});<\/script></body></html>`;
}

async function loadVerifiedData(){
const status=document.getElementById("status");status.textContent="Loading verified dealers and current stock...";
const results=await Promise.all([client.from("public_active_verified_dealers").select("id,dealer_name,town,province,location,logo_url"),client.from("public_active_verified_vehicles_test").select("*").order("updated_at",{ascending:false})]);
if(results[0].error||results[1].error){console.error(results[0].error||results[1].error);status.textContent="Could not load verified dealer data.";return;}
verifiedDealers=results[0].data||[];verifiedVehicles=results[1].data||[];
status.textContent=`Loaded ${verifiedDealers.length} verified dealers and ${verifiedVehicles.length} live vehicles.`;
document.getElementById("dealerList").innerHTML=verifiedDealers.slice().sort(function(a,b){return String(a.dealer_name).localeCompare(String(b.dealer_name));}).map(function(dealer){return`<div class="dealer-row"><strong>${escapeHtml(publicDealerName(dealer.dealer_name,dealerCity(dealer)))}</strong> – ${stockForDealer(dealer).length} vehicles – ${dealerFileName(dealer)}</div>`;}).join("");
}

function buildDealerSitemapEntries(){return verifiedDealers.map(function(dealer){return`<url>\n  <loc>https://carscoutza.com/${dealerFileName(dealer)}</loc>\n  <lastmod>${new Date().toISOString().slice(0,10)}</lastmod>\n  <changefreq>daily</changefreq>\n  <priority>0.9</priority>\n</url>`;}).join("\n\n");}

async function generateAllDealerPages(){
if(!verifiedDealers.length)await loadVerifiedData();if(!verifiedDealers.length)return;if(typeof JSZip==="undefined"){alert("ZIP library has not loaded. Please refresh and try again.");return;}
const zip=new JSZip();verifiedDealers.forEach(function(dealer){zip.file(dealerFileName(dealer),buildDealerPage(dealer,stockForDealer(dealer)));});zip.file("dealer-sitemap-entries.txt",buildDealerSitemapEntries());
const blob=await zip.generateAsync({type:"blob"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="carscoutza-strong-dealer-seo-pages.zip";document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(link.href);},1000);document.getElementById("status").textContent=`Created ${verifiedDealers.length} strong dealer SEO pages.`;
}

async function generateSitemapEntries(){
if(!verifiedDealers.length)await loadVerifiedData();if(!verifiedDealers.length)return;const blob=new Blob([buildDealerSitemapEntries()],{type:"text/plain;charset=utf-8"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="dealer-sitemap-entries.txt";document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(link.href);},1000);
}
