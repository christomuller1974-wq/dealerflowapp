  async function loadVerifiedDealers() {
  document.getElementById("status").textContent = "Loading verified dealers...";

    .from("profiles")
  .select("id, dealer_name, town, province, location")

const grouped = {};

data.forEach(function(dealer) {

  if (!city && dealer.location) {

    city = parts[parts.length - 1].trim();
  }

  city = city || "Unknown City";

city = city
  .toLowerCase()
  .replace(/\b\w/g, function(char) {
    return char.toUpperCase();

  grouped[province][city].push(dealer);

  .replace(/^-+|-+$/g, "");

const finalSlug = slug.includes(citySlug)
  ? slug
  : `${slug}-${citySlug}`;

item.textContent =
  `${dealer.dealer_name} → ${finalSlug}.html`;

list.appendChild(item);
    });
