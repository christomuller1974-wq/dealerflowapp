<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const supabaseUrl = "https://ddmvzypiccryjndcwlre.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkbXZ6eXBpY2NyeWpuZGN3bHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NTQ2NzYsImV4cCI6MjA5MTQzMDY3Nn0.mNkODdvX8gllTZeqfr7nllMWfF7ATdj9MY-EKEE3G6w";

  const client = supabase.createClient(supabaseUrl, supabaseKey);
  async function loadVerifiedDealers() {
  document.getElementById("status").textContent = "Loading verified dealers...";

  const { data, error } = await client
    .from("profiles")
  .select("id, dealer_name, town, province, location")
    .eq("dealer_verified", true);

  if (error) {
    console.error(error);
    document.getElementById("status").textContent =
      "Could not load verified dealers.";
    return;
  }

  document.getElementById("status").textContent =
    `Loaded ${data.length} verified dealers.`;

  const list = document.getElementById("dealerList");
  list.innerHTML = "";

const grouped = {};

data.forEach(function(dealer) {

  let city = dealer.town;

  if (!city && dealer.location) {
    const parts = dealer.location.split(",");
    city = parts[parts.length - 1].trim();
  }

  city = city || "Unknown City";

city = city
  .toLowerCase()
  .replace(/\b\w/g, function(char) {
    return char.toUpperCase();
  });

  const province = dealer.province || "Unknown Province";

  if (!grouped[province]) {
    grouped[province] = {};
  }

  if (!grouped[province][city]) {
    grouped[province][city] = [];
  }

  grouped[province][city].push(dealer);
});

Object.keys(grouped).sort().forEach(function(province) {

  const provinceHeading = document.createElement("h2");
  provinceHeading.textContent = province;
  list.appendChild(provinceHeading);

  Object.keys(grouped[province]).sort().forEach(function(city) {

    const cityHeading = document.createElement("h3");
    cityHeading.textContent = city;
    list.appendChild(cityHeading);

    grouped[province][city].forEach(function(dealer) {

      const item = document.createElement("p");

const slug = dealer.dealer_name
  .toLowerCase()
  .replace(/[^a-z0-9]+/g, "-")
  .replace(/^-+|-+$/g, "");

const citySlug = city
  .toLowerCase()
  .replace(/[^a-z0-9]+/g, "-")
  .replace(/^-+|-+$/g, "");

const finalSlug = slug.includes(citySlug)
  ? slug
  : `${slug}-${citySlug}`;

item.textContent =
  `${dealer.dealer_name} → ${finalSlug}.html`;

list.appendChild(item);
    });

  });

});
    
}

  const fileName = "morgan-motor-group-kimberley.html";

  const html = `<!DOCTYPE html>
<html lang="en">
<head>

        content="Browse vehicles for sale from ${dealerName} in ${city}, ${province}. View available dealer stock on CarScoutZA and contact the dealership directly.">

        href="https://carscoutza.com/${fileName}">
</head>

<body>

  <h1>${dealerName} Vehicles for Sale</h1>

  <p>
    Browse vehicles available from ${dealerName}, a CarScoutZA verified dealer
    in ${city}, ${province}.
  </p>

  <h2>Vehicles from ${dealerName}</h2>

  <p>
    View the dealer's current vehicle stock, compare available vehicles and
    contact the dealership directly through CarScoutZA.
  </p>

  <p>
    <a href="https://carscoutza.com/dealer.html?dealer=${dealerId}">
      View ${dealerName} Stock on CarScoutZA
    </a>
  </p>

  <p>
    <a href="https://carscoutza.com/dealers.html">
      Browse More Verified Car Dealers
    </a>
  </p>

</body>
</html>`;

  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  link.click();

  URL.revokeObjectURL(url);
}
</script>
<body>

  <h1>CarScoutZA Dealer SEO Generator</h1>

<button onclick="loadVerifiedDealers()">Load Verified Dealers</button>
