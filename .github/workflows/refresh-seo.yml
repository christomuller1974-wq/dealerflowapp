name: Refresh SEO stock and sitemap
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-seo
  cancel-in-progress: true
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-seo-hubs.mjs
      - run: node scripts/generate-dealer-seo.mjs
      - run: node scripts/update-sitemap.mjs
      - name: Commit only meaningful changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml dealer-sitemap.xml dealer-seo-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh public SEO stock snapshots [skip ci]"
          git push
